<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stories</title>

    <link rel="stylesheet" href="index.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   기본 설정
========================= */

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background-color: #F5EFE1;
    color: #530E0E;

    font-family: "Gowun Batang", serif;
}


/* =========================
   전체 영역
========================= */

.index {
    width: 100%;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 130px;

    padding: 80px;
}


/* =========================
   왼쪽 소개
========================= */

.intro {
    width: 420px;
}


/* 작은 제목 */

.small-title {
    font-family: sans-serif;

    font-size: 11px;
    letter-spacing: 4px;

    color: #9A6A58;

    margin-bottom: 30px;
}


/* 메인 제목 */

.intro h1 {
    font-size: 3.4rem;
    font-weight: 400;

    line-height: 1.35;

    letter-spacing: -2px;
}


/* 가운데 선 */

.line {
    display: block;

    width: 55px;
    height: 1px;

    background-color: #9A6A58;

    margin: 35px 0;
}


/* 설명 */

.description {
    color: #80665A;

    font-size: 1rem;
    line-height: 2;

    letter-spacing: -0.5px;
}


/* =========================
   메뉴
========================= */

.story-menu {
    width: 500px;

    display: flex;
    flex-direction: column;

    gap: 18px;
}


/* 버튼 */

.story-button {
    position: relative;

    width: 100%;
    height: 105px;

    display: flex;
    align-items: center;

    padding: 0 35px;

    border: 1px solid #D8C7B4;
    border-radius: 4px;

    background-color: rgba(255, 252, 244, 0.65);

    color: #530E0E;

    text-decoration: none;

    transition:
        background-color 0.4s ease,
        border-color 0.4s ease,
        transform 0.4s ease;
}


/* 번호 */

.number {
    width: 55px;

    color: #A87964;

    font-family: sans-serif;

    font-size: 12px;
    letter-spacing: 2px;
}


/* 제목 */

.name {
    font-size: 1.35rem;

    transition: transform 0.4s ease;
}


/* 화살표 */

.arrow {
    position: absolute;

    right: 30px;

    font-family: sans-serif;

    font-size: 1.3rem;

    color: #A87964;

    opacity: 0;

    transform: translateX(-10px);

    transition:
        opacity 0.4s ease,
        transform 0.4s ease;
}


/* =========================
   Hover
========================= */

.story-button:hover {
    background-color: #6F2023;

    border-color: #6F2023;

    color: #F5EFE1;

    transform: translateX(8px);
}

.story-button:hover .number {
    color: #DDB9A6;
}

.story-button:hover .arrow {
    opacity: 1;

    transform: translateX(0);

    color: #F5EFE1;
}


/* =========================
   반응형
========================= */

@media (max-width: 900px) {

    .index {
        flex-direction: column;

        gap: 60px;

        padding: 60px 30px;

        align-items: flex-start;
    }

    .intro {
        width: 100%;
    }

    .story-menu {
        width: 100%;
    }

}


@media (max-width: 500px) {

    .index {
        padding: 45px 20px;
    }

    .intro h1 {
        font-size: 2.5rem;
    }

    .story-button {
        height: 85px;

        padding: 0 22px;
    }

    .name {
        font-size: 1.1rem;
    }

    .arrow {
        right: 20px;
    }

}
    </style>
</head>

<body>

    <main class="index">

        <div class="intro">
            <p class="small-title">today's asignment</p>

            <h1>
                선택하시면<br>
                해당 페이지로 <br> 
                이동합니다.
            </h1>

            <!-- <p class="description">
                서로 다른 세 가지 이야기 속에서<br>
                잠시 시간을 거슬러 올라가 보세요.
            </p> -->
        </div>


        <nav class="story-menu">

            <a href="../1002/msg/msg.html" class="story-button">
                <span class="number">01</span>
                <span class="name">메시지 남기기</span>
                <span class="arrow">→</span>
            </a>

            <a href="../1002/fairytale/fairytale_main.html" class="story-button">
                <span class="number">02</span>
                <span class="name">성냥 팔이 소녀</span>
                <span class="arrow">→</span>
            </a>

            <a href="../1002/java.html" class="story-button">
                <span class="number">03</span>
                <span class="name">Java 학습하기</span>
                <span class="arrow">→</span>
            </a>

        </nav>

    </main>

</body>
</html>
