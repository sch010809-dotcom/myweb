<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memories in Motion</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Nanum+Myeongjo&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            
            background: #e9e1d7;
            color: #403832;
            font-family: "Noto Sans KR", sans-serif;
        }


        /* ========================================
           INTRO
        ======================================== */

        #intro {
            position: fixed;
            inset: 0;
            z-index: 1000;

            background: #151311;
            color: #f5efeb;

            overflow: hidden;

            transition:
                opacity 1.5s ease,
                visibility 1.5s ease;
        }

        #intro.end {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }


        .intro-film {
            position: absolute;
            inset: 0;

            overflow: hidden;

            background: #24201d;
        }


        /* ========================================
           INTRO SCENES
        ======================================== */

        .intro-scene {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            opacity: 0;
        }


        .intro-scene:nth-child(1) {
            animation:
                introScene1 9s ease-in-out forwards;
        }

        .intro-scene:nth-child(2) {
            animation:
                introScene2 9s ease-in-out forwards;
        }

        .intro-scene:nth-child(3) {
            animation:
                introScene3 9s ease-in-out forwards;
        }


        .scene-image {
            width: 100%;
            height: 100%;

            position: relative;

            filter:
                grayscale(0.35)
                sepia(0.18)
                contrast(0.92)
                brightness(0.78);

            transform: scale(1);

            animation:
                slowZoom 9s ease-in-out infinite alternate;
        }


        /* ========================================
           PHOTO BACKGROUND
        ======================================== */

        .scene-one {
            background:
                linear-gradient(
                    rgba(20, 18, 16, 0.25),
                    rgba(20, 18, 16, 0.35)
                ),
                url("img/family.jpg")
                center 40% / cover no-repeat;
        }


        .scene-two {
            background:
                linear-gradient(
                    rgba(20, 18, 16, 0.25),
                    rgba(20, 18, 16, 0.35)
                ),
                url("img/family2.jpg")
                center 50% / cover no-repeat;
        }


        .scene-three {
            background:
                linear-gradient(
                    rgba(20, 18, 16, 0.25),
                    rgba(20, 18, 16, 0.35)
                ),
                url("img/family3.jpg")
                center 45% / cover no-repeat;
        }


        /* 사진 위 어두운 레이어 */

        .scene-image::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    transparent 35%,
                    rgba(0, 0, 0, 0.4) 100%
                );
        }


        /* ========================================
           VIGNETTE
        ======================================== */

        .intro-vignette {
            position: absolute;
            inset: 0;

            z-index: 3;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 35%,
                    rgba(0, 0, 0, 0.55) 100%
                );
        }


        /* ========================================
           GRAIN
        ======================================== */

        .grain {
            position: absolute;
            inset: -50%;

            z-index: 4;

            pointer-events: none;

            opacity: 0.13;

            background-image:

                radial-gradient(
                    circle at 20% 30%,
                    rgba(255, 255, 255, 0.35) 0 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle at 70% 60%,
                    rgba(0, 0, 0, 0.4) 0 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle at 40% 80%,
                    rgba(255, 255, 255, 0.25) 0 1px,
                    transparent 1.5px
                );

            background-size:
                5px 5px,
                7px 7px,
                9px 9px;

            animation:
                grainMove 0.2s steps(2) infinite;
        }


        /* ========================================
           SCRATCH
        ======================================== */

        .scratch {
            position: absolute;
            inset: 0;

            z-index: 5;

            pointer-events: none;

            opacity: 0.08;

            background:
                repeating-linear-gradient(
                    90deg,
                    transparent 0,
                    transparent 48%,
                    rgba(255, 255, 255, 0.3) 49%,
                    transparent 50%
                );

            background-size: 9px 100%;
        }


        /* ========================================
           INTRO TEXT
        ======================================== */

        .intro-text {
            position: absolute;

            top: 50%;
            left: 50%;

            z-index: 10;

            width: 90%;

            text-align: center;

            transform: translate(-50%, -50%);

            opacity: 0;

            animation:
                introTextAppear 1.5s ease 1.5s forwards;
        }


        .intro-small {
            margin-bottom: 25px;

            font-size: 10px;

            letter-spacing: 0.5em;

            opacity: 0.55;
        }


        .intro-title {
            margin: 0;

            font-family:
                "Nanum Myeongjo",
                serif;

            font-size:
                clamp(32px, 5vw, 64px);

            font-weight: 400;

            line-height: 1.45;

            letter-spacing: -0.04em;
        }


        /* ========================================
           MAIN
        ======================================== */

        #main {
            min-height: 100vh;

            display: flex;
            justify-content: center;

            padding:
                100px 20px 120px;

            opacity: 0;

            animation:
                mainAppear 1.5s ease 9s forwards;
        }


        .main-container {
            width: 100%;
            max-width: 820px;
        }


        /* ========================================
           PAGE INTRO
        ======================================== */

        .page-intro {
            margin-bottom: 55px;
        }


        .page-label {
            margin-bottom: 18px;

            font-size: 10px;

            letter-spacing: 0.4em;

            color: #8d8177;
        }


        .page-title {
            margin: 0;

            font-family:
                "Nanum Myeongjo",
                serif;

            font-size:
                clamp(30px, 4vw, 48px);

            font-weight: 400;

            line-height: 1.4;
        }


        .page-description {
            margin-top: 25px;

            font-family:
                "Nanum Myeongjo",
                serif;

            font-size: 16px;

            line-height: 2;

            color: #756b63;
        }


        /* ========================================
           LAST SCENE
        ======================================== */

        .last-scene {
            position: relative;

            padding:
                65px 55px 55px;

            background: #e6ded3;

            border:
                1px solid rgba(80, 65, 55, 0.15);

            box-shadow:
                0 20px 60px rgba(70, 55, 45, 0.08);
        }


        .frame-number {
            position: absolute;

            top: 25px;
            right: 30px;

            font-size: 9px;

            letter-spacing: 0.25em;

            color: #a3978c;
        }


        .scene-label {
            margin-bottom: 15px;

            font-size: 10px;

            letter-spacing: 0.35em;

            color: #8d8177;
        }


        .scene-title {
            margin: 0;

            font-family:
                "Nanum Myeongjo",
                serif;

            font-size: 28px;

            font-weight: 400;
        }


        .scene-description {
            margin-top: 12px;

            font-size: 13px;

            color: #81766d;
        }


        /* ========================================
           MESSAGE
        ======================================== */

        .message-area {
            position: relative;

            margin-top: 55px;
        }


        #message {
            min-height: 220px;

            padding:
                20px 5px;

            outline: none;

            border-bottom:
                1px solid #bdb1a5;

            font-family:
                "Nanum Myeongjo",
                serif;

            font-size: 25px;

            line-height: 2;

            color: #433a34;

            white-space: pre-wrap;
        }


        #message:empty::before {
            content:
                attr(data-placeholder);

            color: #aaa098;

            pointer-events: none;
        }


        .typing-line {
            position: absolute;

            bottom: -5px;
            left: 0;

            width: 100%;
            height: 1px;

            background: transparent;
        }


        /* ========================================
           EMOTION
        ======================================== */

        .emotion-section {
            margin-top: 45px;
        }


        .emotion-label {
            display: block;

            margin-bottom: 18px;

            font-size: 10px;

            letter-spacing: 0.25em;

            color: #8d8177;
        }


        .emotion-buttons {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }


        .emotion-button {
            padding:
                12px 22px;

            border:
                1px solid #cfc5ba;

            border-radius: 999px;

            background: transparent;

            color: #6f655d;

            font-family:
                "Noto Sans KR",
                sans-serif;

            font-size: 12px;

            cursor: pointer;

            transition:
                background 0.25s ease,
                color 0.25s ease,
                border-color 0.25s ease;
        }


        .emotion-button:hover {
            border-color: #8d8177;
        }


        .emotion-button.active {
            background: #55463e;

            border-color: #55463e;

            color: white;
        }


        /* ========================================
           FONT
        ======================================== */

        .font-area {
            margin-top: 45px;
        }


        .font-label {
            display: block;

            margin-bottom: 18px;

            font-size: 10px;

            letter-spacing: 0.25em;

            color: #8d8177;
        }


        .font-options {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }


        .font-option {
            position: relative;

            cursor: pointer;
        }


        .font-option input {
            position: absolute;

            opacity: 0;

            pointer-events: none;
        }


        .font-name {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 140px;
            height: 48px;
            padding: 0;

            border: 1px solid #cfc5ba;
            border-radius: 3px;
            background: transparent;
            color: #6f655d;

            text-align: center;
            line-height: 1;

            transition:
                background 0.25s ease,
                color 0.25s ease,
                border-color 0.25s ease;
        }

        .font-myeongjo {
            font-family: "Nanum Myeongjo", serif;
            font-size: 15px;
        }

        .font-gowun {
            font-family: "Gowun Batang", serif;
            font-size: 15px;
        }

        .font-pen {
            font-family: "Nanum Pen Script", cursive;
            font-size: 16px;
        }


        .font-option input:checked + .font-name {
            background: #55463e;

            border-color: #55463e;

            color: white;
        }


        .font-option:hover .font-name {
            border-color: #8d8177;
        }


        .font-myeongjo {
            font-family:
                "Nanum Myeongjo",
                serif;
        }


        .font-gowun {
            font-family:
                "Gowun Batang",
                serif;
        }


        .font-pen {
            font-family:
                "Nanum Pen Script",
                cursive;

            font-size: 16px;
        }


        /* ========================================
           SEND BUTTON
        ======================================== */

        .send-area {
            display: flex;

            justify-content: center;

            margin-top: 55px;
        }


        #send-button {
            padding:
                16px 40px;

            border: none;

            border-radius: 999px;

            background: #55463e;

            color: white;

            font-family:
                "Noto Sans KR",
                sans-serif;

            font-size: 12px;

            letter-spacing: 0.12em;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }


        #send-button:hover {
            background: #3f342f;

            transform: translateY(-2px);
        }


        /* ========================================
           SEND SCREEN
        ======================================== */

        #send-screen {
            position: fixed;

            inset: 0;

            z-index: 2000;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #171513;

            color: #f5efeb;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 1.2s ease,
                visibility 1.2s ease;
        }


        #send-screen.active {
            opacity: 1;

            visibility: visible;
        }


        /* ========================================
           FINAL MESSAGE
        ======================================== */

        .final-message {
            position: relative;

            z-index: 10;

            width: 90%;

            text-align: center;

            opacity: 0;

            transform: translateY(20px);

            animation:
                finalAppear 1.5s ease forwards;
        }


        .final-small {
            margin-bottom: 35px;

            font-size: 10px;

            letter-spacing: 0.35em;

            color:
                rgba(245, 239, 235, 0.5);
        }


        .final-message h2 {
            margin: 0;

            font-family:
                "Nanum Myeongjo",
                serif;

            font-size:
                clamp(42px, 6vw, 76px);

            font-weight: 400;

            line-height: 1.3;
        }


        .final-message p {
            margin-top: 35px;

            font-family:
                "Nanum Myeongjo",
                serif;

            font-size: 16px;

            line-height: 2;

            color:
                rgba(245, 239, 235, 0.65);
        }


        #resend-button {
            margin-top: 45px;

            padding:
                14px 28px;

            border:
                1px solid rgba(245, 239, 235, 0.4);

            border-radius: 999px;

            background: transparent;

            color: #f5efeb;

            font-size: 12px;

            letter-spacing: 0.12em;

            cursor: pointer;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease;
        }


        #resend-button:hover {
            background: #f5efeb;

            color: #171513;

            border-color: #f5efeb;
        }


        /* ========================================
           SEND GRAIN
        ======================================== */

        .send-grain {
            position: absolute;

            inset: -50%;

            z-index: 3;

            pointer-events: none;

            opacity: 0.08;

            background-image: url("img/paper.png"),
                radial-gradient(
                    rgba(255,255,255,0.6) 1px,
                    transparent 1px
                );

            background-size: 5px 5px;

            animation:
                grainMove 0.2s steps(2) infinite;
        }


        .send-vignette {
            position: absolute;

            inset: 0;

            z-index: 4;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 30%,
                    rgba(0,0,0,0.6) 100%
                );
        }


        /* ========================================
           SHAKE
        ======================================== */

        .shake {
            animation:
                shake 0.4s ease;
        }


        /* ========================================
           ANIMATIONS
        ======================================== */

        @keyframes introScene1 {

            0% {
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            28% {
                opacity: 1;
            }

            36% {
                opacity: 0;
            }

            100% {
                opacity: 0;
            }
        }


        @keyframes introScene2 {

            0% {
                opacity: 0;
            }

            30% {
                opacity: 0;
            }

            40% {
                opacity: 1;
            }

            60% {
                opacity: 1;
            }

            68% {
                opacity: 0;
            }

            100% {
                opacity: 0;
            }
        }


        @keyframes introScene3 {

            0% {
                opacity: 0;
            }

            62% {
                opacity: 0;
            }

            72% {
                opacity: 1;
            }

            92% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }


        @keyframes slowZoom {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.06);
            }
        }


        @keyframes grainMove {

            0% {
                transform:
                    translate(0, 0);
            }

            25% {
                transform:
                    translate(-3%, 2%);
            }

            50% {
                transform:
                    translate(2%, -3%);
            }

            75% {
                transform:
                    translate(3%, 2%);
            }

            100% {
                transform:
                    translate(-2%, -2%);
            }
        }


        @keyframes introTextAppear {

            from {
                opacity: 0;

                transform:
                    translate(-50%, -45%);
            }

            to {
                opacity: 1;

                transform:
                    translate(-50%, -50%);
            }
        }


        @keyframes mainAppear {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        @keyframes finalAppear {

            from {
                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }


        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 600px) {

            #main {
                padding:
                    70px 16px 80px;
            }


            .last-scene {
                padding:
                    50px 25px 35px;
            }


            #message {
                min-height: 200px;

                font-size: 21px;
            }


            .font-name {
                display: flex;
                align-items: center;
                justify-content: center;

                width: 140px;
                height: 48px;

                padding: 0;

                border: 1px solid #cfc5ba;
                border-radius: 3px;

                background: transparent;
                color: #6f655d;

                text-align: center;

                transition:
                    background 0.25s ease,
                    color 0.25s ease,
                    border-color 0.25s ease;
            }


            .final-message h2 {
                font-size: 42px;
            }

        }

    </style>
</head>


<body>


    <!-- ========================================
         INTRO
    ======================================== -->

    <section id="intro">

        <div class="intro-film">

            <!-- Scene 1 -->
            <div class="intro-scene">

                <div class="scene-image scene-one"></div>

            </div>


            <!-- Scene 2 -->
            <div class="intro-scene">

                <div class="scene-image scene-two"></div>

            </div>


            <!-- Scene 3 -->
            <div class="intro-scene">

                <div class="scene-image scene-three"></div>

            </div>


            <div class="intro-vignette"></div>

            <div class="grain"></div>

            <div class="scratch"></div>


            <div class="intro-text">

                <div class="intro-small">
                    MEMORIES IN MOTION
                </div>

                <h1 class="intro-title">
                    당신의 인생은<br>
                    어떤 영화였나요?
                </h1>

            </div>

        </div>

    </section>



    <!-- ========================================
         MAIN
    ======================================== -->

    <main id="main">

        <div class="main-container">


            <div class="page-intro">

                <div class="page-label">
                    THE LAST SCENE
                </div>

                <h2 class="page-title">
                    사실 내가 전하고 싶었던 말은
                </h2>

                <p class="page-description">
                    영화의 마지막 장면에<br>
                    아직 하지 못했던 말을 남겨주세요.
                </p>

            </div>



            <!-- LAST SCENE -->

            <section class="last-scene">




                <div class="scene-label">
                    LAST SCENE
                </div>

                <h3 class="scene-title">
                    마지막 장면을 남겨주세요.
                </h3>

                <p class="scene-description">
                    당신이 적은 말이 이 영화의 마지막 장면이 됩니다.
                </p>



                <!-- MESSAGE -->

                <div class="message-area">

                    <div
                        id="message"
                        contenteditable="true"
                        data-placeholder="여기에 전하고 싶은 말을 적어주세요."
                    ></div>

                    <div class="typing-line"></div>

                </div>



                <!-- EMOTION -->

                <div class="emotion-section">

                    <label class="emotion-label">
                        THIS SCENE FEELS LIKE
                    </label>


                    <div class="emotion-buttons">

                        <button
                            type="button"
                            class="emotion-button"
                            data-emotion="sorry"
                        >
                            미안해
                        </button>


                        <button
                            type="button"
                            class="emotion-button"
                            data-emotion="love"
                        >
                            사랑해
                        </button>


                        <button
                            type="button"
                            class="emotion-button"
                            data-emotion="thanks"
                        >
                            고마워
                        </button>

                    </div>

                </div>



                <!-- FONT -->

                <div class="font-area">

                    <label class="font-label">
                        FONT
                    </label>


                    <div class="font-options">

                        <label class="font-option">

                            <input
                                type="radio"
                                name="font"
                                value="'Nanum Myeongjo'"
                                checked
                            >

                            <span class="font-name font-myeongjo">
                                나눔명조
                            </span>

                        </label>


                        <label class="font-option">

                            <input
                                type="radio"
                                name="font"
                                value="'Gowun Batang'"
                            >

                            <span class="font-name font-gowun">
                                고운바탕
                            </span>

                        </label>


                        <label class="font-option">

                            <input
                                type="radio"
                                name="font"
                                value="'Nanum Pen Script'"
                            >

                            <span class="font-name font-pen">
                                나눔손글씨
                            </span>

                        </label>

                    </div>

                </div>



                <!-- SEND -->

                <div class="send-area">

                    <button
                        type="button"
                        id="send-button"
                    >
                        이 장면을 전하기
                    </button>

                </div>

            </section>

        </div>

    </main>



    <!-- ========================================
         FINAL SCREEN
    ======================================== -->

    <section id="send-screen">

        <div class="final-message">

            <div class="final-small">
                YOUR MESSAGE HAS ARRIVED
            </div>


            <h2>
                마음이<br>
                전해졌습니다.
            </h2>


            <p>
                당신이 남긴 마음이<br>
                소중한 사람에게 도착했습니다.
            </p>


            <button
                type="button"
                id="resend-button"
            >
                한 번 더 보내기
            </button>

        </div>


        <div class="send-grain"></div>

        <div class="send-vignette"></div>

    </section>



    <!-- ========================================
         JAVASCRIPT
    ======================================== -->

    <script>


        /* ========================================
           ELEMENTS
        ======================================== */

        const intro =
            document.getElementById("intro");

        const message =
            document.getElementById("message");

        const emotions =
            document.querySelectorAll(".emotion-button");

        const fontOptions =
            document.querySelectorAll(
                'input[name="font"]'
            );

        const sendButton =
            document.getElementById("send-button");

        const sendScreen =
            document.getElementById("send-screen");

        const resendButton =
            document.getElementById("resend-button");



        /* ========================================
           INTRO END
        ======================================== */

        setTimeout(() => {

            intro.classList.add("end");

        }, 9000);



        /* ========================================
           EMOTION PRESETS
        ======================================== */

        const presets = {

            sorry:
                "그때는 미안하다는 말을\n하지 못했어.",

            love:
                "말로는 다 표현하지 못했지만,\n나는 정말 많이 사랑해.",

            thanks:
                "지금까지 함께해줘서\n정말 고마워."

        };



        /* ========================================
           EMOTION BUTTON
        ======================================== */

        emotions.forEach(button => {

            button.addEventListener("click", () => {


                /* 모든 버튼 active 제거 */

                emotions.forEach(btn => {

                    btn.classList.remove("active");

                });


                /* 현재 버튼 active */

                button.classList.add("active");


                /* 선택한 감정 확인 */

                const emotion =
                    button.dataset.emotion;


                /* 문구 변경 */

                message.innerText =
                    presets[emotion];


                /* 메시지 영역에 포커스 */

                message.focus();


                /* 커서를 문장 마지막으로 이동 */

                const range =
                    document.createRange();

                range.selectNodeContents(message);

                range.collapse(false);


                const selection =
                    window.getSelection();

                selection.removeAllRanges();

                selection.addRange(range);

            });

        });



        /* ========================================
           FONT CHANGE
        ======================================== */

        fontOptions.forEach(option => {

            option.addEventListener("change", () => {

                if (option.checked) {

                    message.style.fontFamily =
                        option.value;

                }

            });

        });



        /* ========================================
           SEND
        ======================================== */

        sendButton.addEventListener("click", () => {

            const text =
                message.innerText.trim();


            /* 메시지가 없으면 */

            if (text === "") {

                message.classList.add("shake");


                setTimeout(() => {

                    message.classList.remove("shake");

                }, 400);


                return;

            }


            /* 마지막 화면 표시 */

            sendScreen.classList.add("active");

        });



        /* ========================================
           CTRL + ENTER
        ======================================== */

        message.addEventListener("keydown", event => {

            if (
                event.ctrlKey &&
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendButton.click();

            }

        });



        /* ========================================
           RESEND
        ======================================== */

        resendButton.addEventListener("click", () => {


            /* 마지막 화면 닫기 */

            sendScreen.classList.remove("active");


            /* 메시지 초기화 */

            message.innerText = "";


            /* 감정 버튼 초기화 */

            emotions.forEach(button => {

                button.classList.remove("active");

            });


            /* 작성 화면으로 이동 */

            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        });


    </script>

</body>
</html>
